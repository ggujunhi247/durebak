name: Bug report
description: Report a reproducible runtime or integration problem.
body:
  - type: markdown
    attributes:
      value: Do not include credentials, session files, database contents or private transcripts. Follow SECURITY.md for vulnerabilities.
  - type: input
    id: versions
    attributes:
      label: Durebak, Node, operating system and host versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps and expected versus actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted doctor output and minimal synthetic example
