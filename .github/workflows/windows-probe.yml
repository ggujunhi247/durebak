name: Windows storage probe
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  storage-probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Exercise actual Windows storage probe
        run: node --test tests/windows-probe.test.mjs tests/windows-probe-report.test.mjs
      - name: Record sanitized investigation evidence
        run: node scripts/windows-storage-probe.mjs
      - name: Build and verify unsupported runtime refusal
        run: |
          npm ci --ignore-scripts
          npm run build
          node --test tests/windows-storage-refusal.test.mjs
          node --import tsx --test tests/updates.test.ts tests/update-trust.test.ts tests/update-cli.test.mjs
